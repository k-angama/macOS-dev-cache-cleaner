name: Upload TestFlight Release

on:
  workflow_run:
    workflows:
      - Test Before Merge
    types:
      - completed
  workflow_dispatch:

jobs:
  upload-testflight:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release/'))
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare CI paths
        run: |
          echo "APP_STORE_CONNECT_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/DevCacheCleaner.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions-AppStoreConnect.plist" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/testflight-export" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        run: |
          printf '%s' '${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}' > "$APP_STORE_CONNECT_API_KEY_PATH"
          chmod 600 "$APP_STORE_CONNECT_API_KEY_PATH"

      - name: Install signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH"; then
            echo "No code signing identity was found in the imported .p12 certificate."
            echo "Export the 3rd Party Mac Developer Application certificate together with its private key from Keychain Access."
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install installer certificate
        env:
          MAC_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/mac-installer-distribution.p12"

          printf '%s' "$MAC_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$INSTALLER_CERTIFICATE_PATH"
          security import "$INSTALLER_CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MAC_INSTALLER_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROVISIONING_PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROVISIONING_PROFILE_PATH="$PROVISIONING_PROFILE_DIR/DevCacheCleaner.provisionprofile"
          PROVISIONING_PROFILE_PLIST="$RUNNER_TEMP/DevCacheCleanerProvisioningProfile.plist"

          mkdir -p "$PROVISIONING_PROFILE_DIR"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROVISIONING_PROFILE_PATH"
          security cms -D -i "$PROVISIONING_PROFILE_PATH" > "$PROVISIONING_PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROVISIONING_PROFILE_PLIST")

          echo "PROVISIONING_PROFILE_PATH=$PROVISIONING_PROFILE_PATH" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Prepare export options
        run: |
          cp ci/ExportOptions-AppStoreConnect.plist "$EXPORT_OPTIONS_PLIST"
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfiles:com.kangama.DevCacheCleaner $PROVISIONING_PROFILE_UUID" \
            "$EXPORT_OPTIONS_PLIST"

      - name: Archive release build
        run: |
          xcodebuild archive \
            -project DevCacheCleaner.xcodeproj \
            -scheme DevCacheCleaner \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" \
            CODE_SIGN_IDENTITY="3rd Party Mac Developer Application" \
            CODE_SIGN_STYLE=Manual \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM=FEV8Q8DHKC \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID"

      - name: Upload archive to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"

      - name: Clean signing assets
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$APP_STORE_CONNECT_API_KEY_PATH"
          if [ -n "${PROVISIONING_PROFILE_PATH:-}" ]; then
            rm -f "$PROVISIONING_PROFILE_PATH"
          fi
